# sm121 — Home Assistant add-on manifest.
#
# Runs the sm121 launcher (the DGX Spark cluster launcher) 24/7 as a
# container: it clones/pulls the configured git recipe repos, keeps them
# fresh (a supervisor re-sync loop), and serves the `sm121 web` dashboard
# on port 3100 — serve/stop/power from the browser, no Mac involved.
#
# The THIN alpine image SHIPS a precompiled sm121 binary (CI compiles it
# from the launcher repo per arch — pinned rust:alpine, trivial cargo
# build → alpine final, dynamic-musl binary, ~20 MB; see
# .github/workflows/build-addon.yaml) and publishes ghcr.io/kilork/sm121-addon. No toolchain, no
# compile-on-boot — a 4 GB Pi must not OOM on a release build. Launcher
# change → re-run this repo's CI → new image.
#
# Design: specs/tech-architecture/ha-addon-recipe-repos.md (launcher repo).
#
# NOTE: the option schema is the OLD-STYLE (flat `option: str/int`) form —
# the new list/editor schema is silently rejected by older supervisors
# (the add-on simply doesn't appear in the store).

name: "sm121"
description: "sm121 DGX Spark launcher — recipe-repo sync + the sm121 web dashboard (serve/stop/power)"
version: "1.3.23"
slug: "sm121"

image: "ghcr.io/kilork/sm121-addon"
# Both archs: the image is arch-generic (no sm121 binary, no toolchain —
# the entrypoint compiles sm121 for the container's own arch on first
# boot). GitHub Actions builds each arch natively (this repo's
# .github/workflows/) and publishes the multi-arch manifest.
arch:
  - aarch64
  - amd64

# The dashboard; host_network exposes it on the HA host's port 3100.
# Apps-framework dict forms (this HA generation's supervisor rejects the
# legacy list forms — see the store log: "expected a dictionary for
# data['environment']/data['ports']").
ports:
  3100/tcp: 3100
ports_description:
  3100/tcp: "sm121 dashboard"
host_network: true

# "OPEN WEB UI" button on the add-on page (and the sidebar entry when the
# supervisor shows panels): the dashboard listens on 3100 directly.
webui: "http://[HOST]:[PORT:3100]/"

environment:
  SM121_WEB_PORT: "3100"

# Apps-framework lifecycle (mirror the working cups-addon manifest):
# startup=services — start when core services are up; no `boot` field —
# the Apps default (auto) starts it at HA boot: the 24/7 service behaviour.
startup: "services"

# The add-on options map 1:1 to the entrypoint's env vars (option name
# uppercased): sm121_recipe_repos → SM121_RECIPE_REPOS (a JSON STRING:
# [{"url":..., "token":...}] — the entrypoint parses it with jq), etc.
# See sm121/rootfs/entrypoint.sh.
options:
  sm121_recipe_repos: ""
  sm121_ssh_user: ""
  sm121_ssh_key_b64: ""
  sm121_ssh_key_b64_lines: []
  sm121_ha_url: ""
  sm121_ha_token: ""
  sm121_registry_base: ""
  sm121_config_extra: ""
  sm121_config_extra_lines: []
  sm121_repo_resync_minutes: 10
  sm121_web_token: ""
  sm121_insecure: false

# OLD-STYLE schema (compatible with every supervisor generation).
# Multi-line values (the cluster TOML, the base64 key, the recipe-repos
# JSON) are plain string fields — paste them in the UI.
schema:
  sm121_recipe_repos: str
  sm121_ssh_user: str
  sm121_ssh_key_b64: str
  sm121_ha_url: str
  sm121_ha_token: str
  sm121_registry_base: str
  # LEGACY: the private TOML block now lives in /data/config-extra.toml and is
  # edited from the dashboard (settings window — a real multi-line editor; the
  # option form has none). This option only SEEDS that file on first boot, so
  # an existing install keeps working and the block shows up in the editor.
  sm121_config_extra: str
  # older line-per-row form of the same legacy seed (superseded by the file)
  sm121_config_extra_lines:
    - str
  sm121_ssh_key_b64_lines:
    - str
  sm121_repo_resync_minutes: int
  sm121_web_token: str
  sm121_insecure: bool
