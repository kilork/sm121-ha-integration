# Build + publish the sm121 HA add-on image (ghcr.io/kilork/sm121-addon).
#
# The image SHIPS a precompiled sm121 binary (no toolchain, no
# compile-on-boot — a 4 GB Pi must not OOM on a release build):
#   1. per-arch job (aarch64 arm runner / amd64 x86 runner): check out
#      this repo + the launcher repo (launcher-src/), docker-build the
#      multi-stage sm121/Dockerfile (rust:alpine compiles the launcher →
#      trivial cargo build on pinned rust:alpine → dynamic-musl binary →
#      alpine final, ~20 MB), push the per-arch image.
#   2. manifest job: compose the multi-arch manifest (:latest + :1.1.0).
#
# Launcher change → push to the launcher repo does NOT trigger this
# workflow (cross-repo); re-run it (workflow_dispatch) or push a no-op
# here — the build always compiles launcher main.
name: Build sm121

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone the launcher repo (gitea, public)
        run: git clone --depth 1 https://git.kilork.org/sm121/launcher.git launcher-src

      - uses: docker/setup-buildx-action@v3

      - name: Read the version from the manifest (image tag must match it)
        id: ver
        run: echo "version=$(ruby -ryaml -e 'puts YAML.load_file("sm121/config.yaml")["version"]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build + push the per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sm121/Dockerfile
          platforms: >-
            ${{
              matrix.arch == 'aarch64'
              && 'linux/arm64'
              || 'linux/amd64'
            }}
          push: true
          # baked into the binary: the dashboard shows it under the title
          build-args: |
            SM121_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,name=sm121-${{ matrix.arch }}
          cache-to: type=gha,mode=max,name=sm121-${{ matrix.arch }}
          tags: |
            ghcr.io/kilork/${{ matrix.arch }}-sm121-addon:latest
            ghcr.io/kilork/${{ matrix.arch }}-sm121-addon:${{ steps.ver.outputs.version }}

  manifest:
    name: Multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Read the version from the manifest
        id: ver
        run: echo "version=$(ruby -ryaml -e 'puts YAML.load_file("sm121/config.yaml")["version"]')" >> "$GITHUB_OUTPUT"

      - name: Compose the multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/kilork/sm121-addon:latest \
            -t ghcr.io/kilork/sm121-addon:${{ steps.ver.outputs.version }} \
            ghcr.io/kilork/aarch64-sm121-addon:latest \
            ghcr.io/kilork/amd64-sm121-addon:latest
